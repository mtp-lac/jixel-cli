name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
          - stable
          - nightly
        default: stable
  schedule:
    # Poll stable upstream releases every three hours; publish nightly daily.
    - cron: '0 */3 * * *'
    - cron: '30 0 * * *'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.prepare.outputs.action }}
      channel: ${{ steps.prepare.outputs.channel }}
      version: ${{ steps.prepare.outputs.version }}
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve release version
        id: prepare
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          CHANNEL=${REQUESTED_CHANNEL:-stable}
          if [ "$SCHEDULE" = '30 0 * * *' ]; then
            CHANNEL=nightly
          fi
          VERSION=$(python .github/scripts/version.py)
          ACTION=release

          if [ "$CHANNEL" = stable ]; then
            api_get() {
              if [ -n "${GH_API_TOKEN:-}" ]; then
                curl -fsSL --retry 2 --retry-delay 2 --retry-all-errors \
                  -H "Authorization: Bearer ${GH_API_TOKEN}" "$1" && return 0
                echo "warning: authenticated request failed; retrying anonymously" >&2
              fi
              curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors "$1"
            }

            UPSTREAM=$(api_get https://api.github.com/repos/awxkee/jixel/releases/latest \
              | jq -r '.tag_name // empty')
            if [ -z "$UPSTREAM" ]; then
              echo "error: upstream has no stable release tag" >&2
              exit 1
            fi
            UPSTREAM=${UPSTREAM#v}
            # Validate and compare stable semver before changing the manifest.
            python - "$VERSION" "$UPSTREAM" <<'PY'
          import re
          import sys
          current, upstream = sys.argv[1:]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", upstream):
              sys.exit(f"Invalid upstream stable version: {upstream}")
          if tuple(map(int, upstream.split('.'))) < tuple(map(int, current.split('.'))):
              sys.exit(f"Upstream {upstream} is older than the pinned version {current}")
          PY
            VERSION=$UPSTREAM
            if [ "$EVENT_NAME" != workflow_dispatch ] && \
               git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
              ACTION=skip
            fi

            if [ "$ACTION" = release ]; then
              python .github/scripts/version.py --sync "$VERSION"
              if ! git diff --quiet -- Cargo.toml; then
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add Cargo.toml
                git commit -m "Update CLI and jixel to ${VERSION}"
                git push origin HEAD:main
              fi
            fi
          fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.action == 'release'
    runs-on: windows-latest
    steps:
      # Build exactly the commit prepared above, including any version sync.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check package and library versions
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: python .github/scripts/version.py --expected "$env:EXPECTED_VERSION"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --release

      - name: Verify binary and resolved library versions
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $metadata = cargo metadata --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $jixel = @($metadata.packages | Where-Object { $_.name -eq 'jixel' })
          if ($jixel.Count -ne 1 -or $jixel[0].version -ne $env:EXPECTED_VERSION) {
            throw "Resolved jixel version does not match $($env:EXPECTED_VERSION)"
          }
          $version = & .\target\release\jixel-cli.exe --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "jixel-cli $($env:EXPECTED_VERSION)") {
            throw "Unexpected CLI version: $version"
          }

      - name: Run tests
        run: |
          # gen-test-images and run-tests share fixtures in the same workspace.
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./gen-test-images.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo run --release --example gen16
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./run-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo run --release --example verify
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package executable
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          $suffix = if ($env:CHANNEL -eq 'nightly') { '-nightly' } else { '' }
          $zip = "jixel-cli-jxl-$($env:VERSION)$suffix-windows-x86_64.zip"
          Compress-Archive -Path target\release\jixel-cli.exe -DestinationPath $zip
          Write-Host "Created $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jixel-cli-windows
          path: jixel-cli-jxl-*.zip

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jixel-cli-windows
          path: ./release

      - name: Generate changelog
        id: changelog
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          NAME="jixel-cli ${VERSION}"
          if [ "$CHANNEL" = nightly ]; then
            TAG=nightly
            NAME="jixel-cli ${VERSION} nightly"
          fi
          PREV_TAG=$(git tag --list 'v[0-9]*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vxF "$TAG" \
            | sort -V \
            | tail -n1 || true)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s")
          else
            CHANGELOG=$(git log --pretty=format:"- %s" -n 20)
          fi
          # A random delimiter prevents commit subjects from ending the output.
          DELIMITER="changelog_$(openssl rand -hex 16)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "changelog<<$DELIMITER" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "$DELIMITER" >> "$GITHUB_OUTPUT"

      - name: Update rolling nightly tag and assets
        if: needs.prepare.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git tag --force nightly HEAD
          git push --force origin refs/tags/nightly
          # Remove obsolete versioned ZIPs from the rolling release.
          if gh release view nightly > /dev/null 2>&1; then
            while IFS= read -r asset; do
              gh release delete-asset nightly "$asset" --yes
            done < <(gh release view nightly --json assets --jq '.assets[].name')
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: ${{ steps.changelog.outputs.name }}
          body: |
            ## ${{ steps.changelog.outputs.name }}

            CLI wrapper for the **jixel** JPEG XL encoder. Both jixel-cli and
            jixel use version **${{ needs.prepare.outputs.version }}**.

            Channel: **${{ needs.prepare.outputs.channel }}**
            Commit: ${{ needs.prepare.outputs.sha }}

            ### Changes
            ${{ steps.changelog.outputs.changelog }}
          files: ./release/*.zip
          draft: false
          prerelease: ${{ needs.prepare.outputs.channel == 'nightly' }}
          make_latest: ${{ needs.prepare.outputs.channel == 'stable' && 'true' || 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
