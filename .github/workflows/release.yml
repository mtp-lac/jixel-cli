name: Release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    outputs:
      jixel_version: ${{ steps.jixel.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract jixel version
        id: jixel
        run: |
          $content = Get-Content Cargo.toml -Raw
          if ($content -match 'jixel\s*=\s*\{[^}]*version\s*=\s*"([^"]+)"') {
            $ver = $matches[1]
            Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"
          }
          Write-Host "Extracted jixel version: ${{ steps.jixel.outputs.version }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --release

      - name: Run tests
        run: |
          # Full pipeline: 8-bit fixtures -> 16-bit/float fixtures ->
          # encode matrix -> jxl-oxide decode verification. gen-test-images
          # and run-tests must run in the same step (fresh shell per step).
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./gen-test-images.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo run --release --example gen16
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./run-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo run --release --example verify
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package executable
        run: |
          $exe = "target\release\jixel-cli.exe"
          $zip = "jixel-cli-jxl-${{ steps.jixel.outputs.version }}-windows-x86_64.zip"
          Compress-Archive -Path $exe -DestinationPath $zip
          Write-Host "Created $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jixel-cli-windows
          path: jixel-cli-jxl-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jixel-cli-windows
          path: ./release

      - name: Generate changelog
        id: changelog
        run: |
          JXEL_VERSION="${{ needs.build.outputs.jixel_version }}"
          TAG="v${JXEL_VERSION}"

          # Compare against the previous tag if it exists.
          PREV_TAG=$(git describe --tags --abbrev=0 ${TAG}^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s")
          else
            CHANGELOG=$(git log --pretty=format:"- %s" -n 20)
          fi

          echo "version=$JXEL_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: jixel-cli ${{ steps.changelog.outputs.version }}
          body: |
            ## jixel-cli — jxl ${{ steps.changelog.outputs.version }}

            CLI wrapper for the **jixel** JPEG XL encoder, built against
            jixel **${{ steps.changelog.outputs.version }}**.

            ### Changes
            ${{ steps.changelog.outputs.changelog }}
          files: ./release/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}