name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    outputs:
      jixel_version: ${{ steps.jixel.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract jixel version
        id: jixel
        run: |
          JXEL_VERSION=$(grep -oP 'jixel\s*=\s*\{[^}]*version\s*=\s*"\K[^"]+' Cargo.toml | head -1)
          echo "version=$JXEL_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --release

      - name: Run tests
        run: |
          cargo run --release --example gen16
          cargo run --release --example verify
        continue-on-error: true

      - name: Package executable
        run: |
          $exe = "target\release\jixel-cli.exe"
          $zip = "jixel-cli-jxl-${{ steps.jixel.outputs.version }}-windows-x86_64.zip"
          Compress-Archive -Path $exe -DestinationPath $zip
          Write-Host "Created $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jixel-cli-windows
          path: jixel-cli-jxl-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jixel-cli-windows
          path: ./release

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          # When triggered by tag push, compare against the previous tag.
          if [ -n "$TAG" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 ${TAG}^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(git log ${PREV_TAG}..${TAG} --pretty=format:"- %s")
            else
              CHANGELOG=$(git log --pretty=format:"- %s")
            fi
          else
            CHANGELOG=$(git log --pretty=format:"- %s" -n 20)
          fi

          # Default to HEAD version for manual dispatch.
          JXEL_VERSION="${{ needs.build.outputs.jixel_version }}"
          echo "version=$JXEL_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${JXEL_VERSION}" >> $GITHUB_OUTPUT
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: jixel-cli ${{ steps.changelog.outputs.version }}
          body: |
            ## jixel-cli — jxl ${{ steps.changelog.outputs.version }}

            CLI wrapper for the **jixel** JPEG XL encoder, built against
            jixel **${{ steps.changelog.outputs.version }}**.

            ### Changes
            ${{ steps.changelog.outputs.CHANGELOG }}
          files: ./release/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}