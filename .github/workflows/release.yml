name: Release

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cannot subscribe to another repository's events, so this
    # polls upstream awxkee/jixel and only runs the release pipeline when a
    # newer jixel version than the one pinned in Cargo.toml is published.
    - cron: '0 */3 * * *'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.check.outputs.action }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream jixel release
        id: check
        env:
          # GITHUB_TOKEN is only available to steps that declare it explicitly;
          # `set -u` aborts the step otherwise. Read-only, public repo.
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Latest published jixel release (tags are bare semver, e.g. 0.5.7).
          # Authenticated when a token is present (higher rate limit); if the
          # token is rejected, fall back to anonymous access rather than
          # failing the poll outright.
          api_get() {
            if [ -n "${GH_API_TOKEN:-}" ]; then
              curl -fsSL --retry 2 --retry-delay 2 --retry-all-errors \
                -H "Authorization: Bearer ${GH_API_TOKEN}" "$1" && return 0
              echo "warning: authenticated request failed; retrying anonymously" >&2
            fi
            curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors "$1"
          }

          UPSTREAM=$(api_get https://api.github.com/repos/awxkee/jixel/releases/latest \
            | jq -r '.tag_name // empty')
          if [ -z "$UPSTREAM" ]; then
            echo "action=skip" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          UPSTREAM=${UPSTREAM#v}

          # Version currently pinned in Cargo.toml.
          CURRENT=$(sed -nE 's/^jixel\s*=\s*\{[^}]*version\s*=\s*"([^"]+)".*/\1/p' Cargo.toml | head -n1)

          newer() {
            local x y x1 x2 x3 y1 y2 y3
            x="${1//[^0-9.]/}"
            y="${2//[^0-9.]/}"
            IFS=. read -r x1 x2 x3 <<< "$x"
            IFS=. read -r y1 y2 y3 <<< "$y"
            x1=${x1:-0}; x2=${x2:-0}; x3=${x3:-0}
            y1=${y1:-0}; y2=${y2:-0}; y3=${y3:-0}
            [ "$x1" -gt "$y1" ] && return 0
            [ "$x1" -eq "$y1" ] && [ "$x2" -gt "$y2" ] && return 0
            [ "$x1" -eq "$y1" ] && [ "$x2" -eq "$y2" ] && [ "$x3" -gt "$y3" ] && return 0
            return 1
          }

          ACTION=skip
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual runs always build and release the current state.
            ACTION=release
          elif [ -n "$CURRENT" ] && [ "$UPSTREAM" != "$CURRENT" ] && \
               newer "$UPSTREAM" "$CURRENT"; then
            # Upstream published something newer; skip if we already released it.
            if ! git ls-remote --tags origin "refs/tags/v${UPSTREAM}" | grep -q .; then
              ACTION=release
            fi
          fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "version=$UPSTREAM" >> "$GITHUB_OUTPUT"

      - name: Sync jixel dependency
        if: steps.check.outputs.action == 'release'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail

          # Read the jixel version currently pinned in Cargo.toml.
          current_version() {
            sed -nE 's/^jixel[[:space:]]*=[[:space:]]*\{[^}]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1
          }

          CURRENT=$(current_version)
          if [ -n "$CURRENT" ] && [ "$VERSION" != "$CURRENT" ]; then
            # Rewrite the version value only; the rest of the line is preserved.
            #
            # Two GNU sed pitfalls are avoided deliberately:
            #
            #  1. A quote must not be backslash-escaped inside a bracket
            #     expression. Writing [^\"] makes GNU sed abort with
            #     "Invalid preceding regular expression". The quote is held in
            #     the shell variable q and spliced in unescaped.
            #
            #  2. A backreference must never be followed directly by a digit.
            #     Using \1${VERSION} would give \10.5.9, which sed reads as
            #     backreference \10. Here the only backreference (\1) is
            #     followed by a literal quote, so the substitution is
            #     unambiguous for any version number.
            q='"'
            re='s/^(jixel[[:space:]]*=[[:space:]]*\{[^}]*version[[:space:]]*=[[:space:]]*)'"${q}"'[^'"${q}"']+'"${q}"'/\1'${q}${VERSION}${q}'/'
            sed -E -i -e "${re}" Cargo.toml

            # Fail loudly rather than committing an unchanged Cargo.toml.
            UPDATED=$(current_version)
            if [ "$UPDATED" != "$VERSION" ]; then
              echo "error: failed to update jixel version in Cargo.toml (still '${UPDATED}', wanted '${VERSION}')" >&2
              exit 1
            fi
            echo "Updated jixel dependency: ${CURRENT} -> ${UPDATED}"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml
            git commit -m "Update to jixel ${VERSION}"
            git push origin HEAD:main
          fi

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.action == 'release'
    runs-on: windows-latest
    outputs:
      jixel_version: ${{ steps.jixel.outputs.version }}
    steps:
      # Check out the latest main, not the commit this run started from.
      # check-upstream may have pushed a "Update to jixel X" commit, and the
      # build must use that synced Cargo.toml; otherwise the release is
      # published under the previous version's tag.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract jixel version
        id: jixel
        env:
          # The version that check-upstream resolved (and synced Cargo.toml to).
          EXPECTED_VERSION: ${{ needs.check-upstream.outputs.version }}
        run: |
          $content = Get-Content Cargo.toml -Raw
          if ($content -match 'jixel\s*=\s*\{[^}]*version\s*=\s*"([^"]+)"') {
            $ver = $matches[1]
            Write-Host "Extracted jixel version: $ver"
            # This job checks out a commit snapshot. If that snapshot predates
            # the "Sync jixel dependency" commit, Cargo.toml still carries the
            # old version, and publishing under it would reuse the previous
            # tag instead of creating the new release. Fail rather than ship a
            # mislabelled build.
            if ($env:EXPECTED_VERSION -and $ver -ne $env:EXPECTED_VERSION) {
              Write-Error "Cargo.toml pins jixel $ver but the release is for $($env:EXPECTED_VERSION); the synced commit was not checked out."
              exit 1
            }
            Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"
          } else {
            Write-Error "Could not find the jixel dependency version in Cargo.toml"
            exit 1
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --release

      - name: Run tests
        run: |
          # Full pipeline: 8-bit fixtures -> 16-bit/float fixtures ->
          # encode matrix -> jxl-oxide decode verification. gen-test-images
          # and run-tests must run in the same step (fresh shell per step).
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./gen-test-images.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo run --release --example gen16
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./run-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo run --release --example verify
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package executable
        run: |
          $exe = "target\release\jixel-cli.exe"
          $zip = "jixel-cli-jxl-${{ steps.jixel.outputs.version }}-windows-x86_64.zip"
          Compress-Archive -Path $exe -DestinationPath $zip
          Write-Host "Created $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jixel-cli-windows
          path: jixel-cli-jxl-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Full history and tags are required: the changelog compares against the
      # previous release tag, which a shallow single-commit clone cannot see.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jixel-cli-windows
          path: ./release

      - name: Generate changelog
        id: changelog
        run: |
          JXEL_VERSION="${{ needs.build.outputs.jixel_version }}"
          TAG="v${JXEL_VERSION}"

          # Compare against the most recent existing release tag. ${TAG} does
          # not exist yet (it is created by the next step), so ${TAG}^ would
          # never resolve; list only vX.Y.Z tags and take the highest one
          # that is not the tag being released.
          PREV_TAG=$(git tag --list 'v[0-9]*' \
            | grep -vx "$TAG" \
            | sort -V \
            | tail -n1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s")
          else
            CHANGELOG=$(git log --pretty=format:"- %s" -n 20)
          fi

          echo "version=$JXEL_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: jixel-cli ${{ steps.changelog.outputs.version }}
          body: |
            ## jixel-cli — jxl ${{ steps.changelog.outputs.version }}

            CLI wrapper for the **jixel** JPEG XL encoder, built against
            jixel **${{ steps.changelog.outputs.version }}**.

            ### Changes
            ${{ steps.changelog.outputs.changelog }}
          files: ./release/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
