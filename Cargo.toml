[package]
name = "jixel-cli"
version = "0.1.0"
edition = "2024"
description = "CLI adapter for jixel JPEG XL encoder"
license = "BSD-3-Clause OR Apache-2.0"

[dependencies]
jixel = { version = "0.3.4", features = ["avx", "sse", "splines"] }
image = "0.25"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

[[bin]]
name = "jixel-cli"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true
debug = false

[dev-dependencies]
jxl-oxide = { version = "0.12.6", features = ["image"] }
